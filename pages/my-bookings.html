<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | IRCTC Clone</title>
    <!-- CRITICAL: The ../ is needed because this file is inside the /pages folder -->
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="bg-linear-to-r from-blue-50 via-gray-100 to-blue-100 moving-bg text-gray-800 font-sans">
    
    <div class="max-w-5xl mx-auto p-6 mt-8">
        <h2 class="text-2xl font-bold text-irctc-blue mb-6">My Bookings</h2>
        
        <!-- Booking Card -->
        <div class="bg-white rounded-lg shadow border border-gray-200 mb-4 overflow-hidden">
            <!-- Card Header -->
            <div class="bg-gray-50 border-b border-gray-200 px-6 py-3 flex justify-between items-center">
                <div class="font-semibold text-gray-700">PNR: 8493028491</div>
                <span class="px-3 py-1 bg-green-100 text-green-700 text-sm font-bold rounded-full">CONFIRMED</span>
            </div>
            
            <!-- Card Body -->
            <div class="p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-900">12625 / KERALA EXPRESS</h3>
                    <p class="text-gray-500 text-sm mt-1">15 Aug 2026 • 3A • General (GN)</p>
                    
                    <!-- Station to Station -->
                    <div class="mt-4 flex items-center space-x-4">
                        <div>
                            <p class="font-bold text-lg">TVC</p>
                            <p class="text-xs text-gray-500">11:15</p>
                        </div>
                        <div class="text-gray-400 font-bold">⟶</div>
                        <div>
                            <p class="font-bold text-lg">NDLS</p>
                            <p class="text-xs text-gray-500">13:30 (+2)</p>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons (Including Cancel Ticket UI) -->
                <div class="flex flex-col space-y-3 w-full md:w-auto">
                    <button class="bg-blue-600 hover:bg-blue-800 text-white px-6 py-2 rounded transition shadow-sm font-semibold">
                        View Details
                    </button>
                    <button class="border-2 border-red-500 text-red-500 hover:bg-red-50 px-6 py-2 rounded transition font-semibold">
                        Cancel Ticket
                    </button>
                </div>
            </div>
        </div>
        
    </div>
<script src="../js/train-animation.js"></script>
</body>
</html>
