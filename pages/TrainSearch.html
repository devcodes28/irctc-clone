<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Search | IRCTC Clone</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans bg-gray-50 m-0 min-h-screen flex flex-col">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-8 pt-4 md:pt-8 shrink-0">
        <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">
            <nav class="flex items-center justify-between p-4 mb-0">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="home.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Home</a>
                    <a href="TrainSearch.html" class="text-irctc-orange font-bold border-b-2 border-irctc-orange pb-1 transition-colors">Trains</a>
                    <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                    <a href="e-wallet.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                    <a href="alerts.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors flex items-center">Alerts <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1.5 shadow-sm">2</span></a>
                    <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='my-bookings.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors">
                        My Bookings
                    </button>
                    <button onclick="window.location.href='login.html'" class="bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors">
                        Login / Register
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- STANDARDIZED CONTENT AREA -->
    <main class="w-full relative z-10 px-4 md:px-8 py-6 md:py-10 grow">
        <div class="max-w-300 mx-auto">
            
            <div class="bg-white p-6 shadow-md rounded-md mb-6 border-t-4 border-irctc-blue">
                <h2 class="text-2xl font-bold text-irctc-blue mb-6">Book Ticket</h2>
                
                <form class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="flex flex-col">
                        <label class="text-gray-700 font-semibold mb-1">From</label>
                        <input type="text" placeholder="Leaving from..." class="border border-gray-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-irctc-blue">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-gray-700 font-semibold mb-1">To</label>
                        <input type="text" placeholder="Going to..." class="border border-gray-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-irctc-blue">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-gray-700 font-semibold mb-1">Date</label>
                        <input type="date" class="border border-gray-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-irctc-blue">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-gray-700 font-semibold mb-1">Class</label>
                        <select class="border border-gray-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-irctc-blue bg-white">
                            <option>All Classes</option>
                            <option>Sleeper (SL)</option>
                            <option>AC 3 Tier (3A)</option>
                            <option>AC 2 Tier (2A)</option>
                            <option>AC First Class (1A)</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label class="text-gray-700 font-semibold mb-1">Quota</label>
                        <select class="border border-gray-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-irctc-blue bg-white">
                            <option>General</option>
                            <option>Ladies</option>
                            <option>Tatkal</option>
                            <option>Senior Citizen</option>
                        </select>
                    </div>
                    <div class="flex items-end mt-2 lg:mt-0">
                        <button type="button" onclick="window.location.href='search-results.html'" class="w-full bg-irctc-orange hover:bg-orange-600 text-white font-bold py-3 px-4 rounded shadow transition-colors">
                            Search Trains
                        </button>
                    </div>
                </form>

                <!-- NEW PROFESSIONAL ACTION BUTTONS -->
                <div class="mt-8 pt-6 border-t border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- PNR Status Button -->
                    <button onclick="window.location.href='pnr-status.html'" class="flex items-center justify-start gap-4 bg-white hover:bg-gray-50 border border-gray-300 hover:border-irctc-blue rounded-xl p-5 transition-all shadow-sm group">
                        <div class="bg-blue-50 text-irctc-blue rounded-full w-12 h-12 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform">
                            <!-- Professional Ticket SVG -->
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                            </svg>
                        </div>
                        <div class="text-left">
                            <span class="block text-lg font-bold text-gray-900 group-hover:text-irctc-blue transition-colors">Check PNR Status</span>
                            <span class="block text-sm text-gray-500">Check your PNR</span>
                        </div>
                    </button>

                    <!-- Train Schedule Button -->
                    <button onclick="window.location.href='train-schedule.html'" class="flex items-center justify-start gap-4 bg-white hover:bg-gray-50 border border-gray-300 hover:border-irctc-orange rounded-xl p-5 transition-all shadow-sm group">
                        <div class="bg-orange-50 text-irctc-orange rounded-full w-12 h-12 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform">
                            <!-- Professional Calendar SVG -->
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="text-left">
                            <span class="block text-lg font-bold text-gray-900 group-hover:text-irctc-orange transition-colors">Train Schedule</span>
                            <span class="block text-sm text-gray-500">Check your train schedule</span>
                        </div>
                    </button>

                </div>

            </div>
        </div>
    </main>

    <footer style="background-color: #071936 !important;" class="text-white pt-10 pb-6 border-t-4 border-irctc-orange relative z-30 w-full shadow-xl shrink-0 mt-auto">
        <div class="max-w-300 mx-auto px-4 md:px-8 text-center text-xs text-gray-300">
            <p class="font-medium">Copyright © 2026 - www.irctc.co.in. All Rights Reserved</p>
            <p class="mt-1 text-gray-400 text-[11px]">Designed and Hosted by CRIS</p>
        </div>
    </footer>
    
    <script src="../js/train-animation.js"></script>
</body>
</html>
