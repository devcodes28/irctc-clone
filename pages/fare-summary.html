<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fare Summary - IRCTC</title>

    <link rel="stylesheet" href="../assets/css/output.css">
</head>

<body class="bg-gray-100">

    <header class="w-full px-4 md:px-8 pt-4 md:pt-8">

        <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">

            <nav class="flex items-center justify-between p-4">

                <div class="flex items-center cursor-pointer"
                     onclick="window.location.href='../index.html'">

                    <span class="text-3xl font-bold text-irctc-blue">
                        IRCTC
                    </span>

                </div>

                <div class="flex items-center space-x-3">

                    <button
                        onclick="window.location.href='my-bookings.html'"
                        class="border-2 border-irctc-blue text-irctc-blue font-bold py-2 px-4 rounded">

                        My Bookings

                    </button>

                    <button
                        onclick="window.location.href='login.html'"
                        class="bg-irctc-orange text-white font-bold py-2 px-4 rounded">

                        Login / Register

                    </button>

                </div>

            </nav>

        </div>

    </header>


    <main class="px-4 md:px-8 py-8">

        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">

            <h1 class="text-2xl font-bold text-gray-800 mb-6">
                Fare Summary
            </h1>


            <!-- PASSENGER DETAILS -->

            <div class="border-b pb-5 mb-5">

                <h2 class="text-lg font-bold mb-3">
                    Passenger Details
                </h2>

                <p>
                    <strong>Name:</strong>
                    <span id="passengerName"></span>
                </p>

                <p>
                    <strong>Age:</strong>
                    <span id="passengerAge"></span>
                </p>

                <p>
                    <strong>Gender:</strong>
                    <span id="passengerGender"></span>
                </p>

            </div>


            <!-- JOURNEY DETAILS -->

            <div class="border-b pb-5 mb-5">

                <h2 class="text-lg font-bold mb-3">
                    Journey Details
                </h2>

                <p>
                    <strong>Class:</strong>
                    <span id="travelClass"></span>
                </p>

                <p>
                    <strong>Seat:</strong>
                    <span id="seatNumber"></span>
                </p>

            </div>


            <!-- FARE -->

            <div class="border-b pb-5 mb-5">

                <h2 class="text-lg font-bold mb-4">
                    Fare Details
                </h2>

                <div class="flex justify-between mb-2">

                    <span>Base Fare</span>

                    <span>₹850</span>

                </div>

                <div class="flex justify-between mb-2">

                    <span>Reservation Fee</span>

                    <span>₹40</span>

                </div>

                <div class="flex justify-between mb-2">

                    <span>GST</span>

                    <span>₹45</span>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="flex justify-between text-xl font-bold mb-6">

                <span>Total Fare</span>

                <span>₹935</span>

            </div>


            <button
                id="reviewButton"
                class="w-full bg-irctc-orange text-white font-bold py-3 rounded-lg">

                Continue to Review Booking

            </button>

        </div>

    </main>


    <script src="../js/fare-summary.js"></script>

</body>

</html>
