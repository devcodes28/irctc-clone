<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details - IRCTC</title>

    <link rel="stylesheet" href="../assets/css/output.css">
</head>

<body class="bg-gray-100">

<header class="w-full px-4 md:px-8 pt-4 md:pt-8">
    <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">
        <nav class="flex items-center justify-between p-4">

            <div class="flex items-center cursor-pointer"
                 onclick="window.location.href='../index.html'">
                <span class="text-3xl font-bold text-irctc-blue">
                    IRCTC
                </span>
            </div>

            <div class="flex items-center space-x-3">

                <button
                    onclick="window.location.href='my-bookings.html'"
                    class="border-2 border-irctc-blue text-irctc-blue font-bold py-2 px-4 rounded">
                    My Bookings
                </button>

                <button
                    onclick="window.location.href='login.html'"
                    class="bg-irctc-orange text-white font-bold py-2 px-4 rounded">
                    Login / Register
                </button>

            </div>

        </nav>
    </div>
</header>

<main class="px-4 md:px-8 py-8">

    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">

        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            Passenger Details
        </h1>

        <form id="passengerForm" class="space-y-4">

            <div>
                <label for="name" class="font-semibold">Full Name</label>
                <input id="name"
                       type="text"
                       class="w-full border rounded p-2 mt-1">
            </div>

            <div>
                <label for="age" class="font-semibold">Age</label>
                <input id="age"
                       type="number"
                       class="w-full border rounded p-2 mt-1">
            </div>

            <div>
                <label for="gender" class="font-semibold">Gender</label>
                <select id="gender"
                        class="w-full border rounded p-2 mt-1">

                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>

                </select>
            </div>

            <div>
                <label for="mobile" class="font-semibold">Mobile Number</label>
                <input id="mobile"
                       type="text"
                       class="w-full border rounded p-2 mt-1">
            </div>

            <div>
                <label for="email" class="font-semibold">Email</label>
                <input id="email"
                       type="email"
                       class="w-full border rounded p-2 mt-1">
            </div>

            <div>
                <label for="idProof" class="font-semibold">ID Proof</label>
                <select id="idProof"
                        class="w-full border rounded p-2 mt-1">

                    <option value="">Select ID Proof</option>
                    <option>Aadhaar</option>
                    <option>Passport</option>
                    <option>Driving License</option>
                    <option>Voter ID</option>

                </select>
            </div>

            <div>
                <label for="idNumber" class="font-semibold">ID Number</label>
                <input id="idNumber"
                       type="text"
                       class="w-full border rounded p-2 mt-1">
            </div>

            <button
                type="submit"
                class="w-full bg-irctc-orange text-white font-bold py-3 rounded">

                Continue to Seat Selection

            </button>

        </form>

    </div>

</main>

<script src="../js/passenger-details.js"></script>

</body>
</html>
