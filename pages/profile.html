<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | IRCTC Clone</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans relative min-h-screen">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-8 pt-4 md:pt-8">
        <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">
        <nav class="flex items-center justify-between p-4 mb-0">
            <!-- Logo -->
            <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
            </div>
            
            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-6 items-center">
                <a href="home.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Home</a>
                <a href="TrainSearch.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Trains</a>
                <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                <!-- NEW LINKS -->
                <a href="e-wallet.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                <a href="alerts.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors flex items-center">
                    Alerts 
                    <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1.5 shadow-sm">2</span>
                </a>
                <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='my-bookings.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors">
                    My Bookings
                </button>
                <button onclick="window.location.href='login.html'" class="bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors">
                    Login / Register
                </button>
            </div>
        </nav>
        </div>
    </header>

    <!-- STANDARDIZED CONTENT AREA -->
    <main class="w-full relative z-10 px-4 md:px-8 py-6 md:py-10">
        <div class="max-w-300 mx-auto">
            
            <h2 class="text-2xl font-bold text-irctc-blue mb-6">User Profile</h2>
            
            <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden max-w-4xl">
                <div class="bg-blue-800 p-6 text-white flex items-center space-x-4">
                    <div class="w-16 h-16 bg-white text-blue-800 rounded-full flex items-center justify-center text-2xl font-bold shadow-inner">SS</div>
                    <div>
                        <h3 class="text-xl font-bold">Sreedev Suresh</h3>
                        <p class="text-blue-200 text-sm">IRCTC User ID: sreedev_28</p>
                    </div>
                </div>

                <div class="p-6">
                    <h4 class="text-gray-700 font-bold mb-4 border-b pb-2">Personal Details</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
                            <input type="text" value="Sreedev Suresh" class="w-full border border-gray-300 rounded p-2 bg-gray-100 text-gray-500 focus:outline-none" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Date of Birth</label>
                            <input type="date" value="2005-06-28" class="w-full border border-gray-300 rounded p-2 bg-gray-100 text-gray-500 focus:outline-none" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Email Address</label>
                            <input type="email" value="sreedev@example.com" class="w-full border border-gray-300 rounded p-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Mobile Number</label>
                            <input type="tel" value="+91 9876543210" class="w-full border border-gray-300 rounded p-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                    </div>
                    <div class="mt-8 flex justify-end">
                        <button class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-2 rounded font-bold transition shadow">Save Changes</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="../js/train-animation.js"></script>
</body>
</html>
