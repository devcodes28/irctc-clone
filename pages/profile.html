<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | IRCTC Clone</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans bg-gray-50 m-0 min-h-screen flex flex-col overflow-x-hidden">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-6 pt-4 md:pt-8 shrink-0">
        <div class="max-w-300 w-full mx-auto bg-white rounded-lg shadow-sm">
            <nav class="flex items-center justify-between p-4 mb-0">
                <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
                </div>
                
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="dashboard.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Dashboard</a>
                    <a href="TrainSearch.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Trains</a>
                    <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                    <a href="e-wallet.html" id="navEwallet" class="hidden text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                    <a href="alerts.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors flex items-center">Alerts <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1.5 shadow-sm">2</span></a>
                    <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='dashboard.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors text-sm">
                        Dashboard
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="w-full relative z-10 px-4 md:px-6 py-6 md:py-10 grow">
        <div class="max-w-225 w-full mx-auto">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-irctc-blue">Account Profile</h2>
                <button onclick="window.location.href='dashboard.html'" class="text-xs font-bold text-gray-500 hover:text-irctc-orange transition flex items-center gap-1">
                    &larr; Back to Dashboard
                </button>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <!-- Profile Header Banner -->
                <div class="bg-linear-to-r from-irctc-blue to-blue-800 p-6 md:p-8 text-white flex flex-col sm:flex-row items-center sm:items-start gap-4">
                    <div id="profileInitials" class="w-20 h-20 bg-white text-irctc-blue rounded-full flex items-center justify-center text-2xl font-black shadow-inner shrink-0">--</div>
                    <div class="text-center sm:text-left">
                        <h3 id="profileName" class="text-2xl font-black">--</h3>
                        <p id="profileId" class="text-blue-200 text-sm mt-0.5">IRCTC User ID: --</p>
                        <span class="inline-block mt-3 bg-white/10 text-blue-100 text-[10px] font-bold px-2.5 py-1 rounded-full border border-white/20 uppercase tracking-wider">Verified Account</span>
                    </div>
                </div>

                <!-- Profile Form -->
                <div class="p-6 md:p-8">
                    <h4 class="text-gray-900 font-bold mb-4 border-b border-gray-100 pb-2 text-sm uppercase tracking-wider">Personal Information</h4>
                    
                    <form id="profileForm" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">Full Name (Locked)</label>
                                <input type="text" id="p_fullName" class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 text-gray-500 font-medium text-sm outline-none cursor-not-allowed" disabled>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">Date of Birth (Locked)</label>
                                <input type="text" id="p_dob" value="June 28, 2005" class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 text-gray-500 font-medium text-sm outline-none cursor-not-allowed" disabled>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
                                <input type="email" id="p_email" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-irctc-blue focus:ring-2 focus:ring-blue-100 outline-none transition text-sm font-semibold text-gray-800">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Mobile Number</label>
                                <input type="tel" id="p_mobile" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-irctc-blue focus:ring-2 focus:ring-blue-100 outline-none transition text-sm font-semibold text-gray-800">
                            </div>
                        </div>

                        <div class="mt-8 pt-4 border-t border-gray-100 flex justify-end gap-3">
                            <button type="submit" class="bg-irctc-orange hover:bg-orange-600 text-white px-8 py-3 rounded-lg font-bold transition shadow-sm text-sm">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <footer style="background-color: #071936 !important;" class="text-white pt-10 pb-6 border-t-4 border-irctc-orange relative z-30 w-full shadow-xl shrink-0 mt-auto">
        <div class="max-w-300 w-full mx-auto px-4 md:px-8 text-center text-xs text-gray-300">
            <p class="font-medium">Copyright © 2026 - www.irctc.co.in. All Rights Reserved</p>
        </div>
    </footer>

    <!-- INJECT DB SIMULATION -->
    <script src="../js/db.js"></script>

    <!-- PROFILE MANAGEMENT SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = DB_API.getCurrentUser();
            if (!currentUser) {
                alert("Please login to view your profile.");
                window.location.href = 'login.html';
                return;
            }

            // Populate Profile UI fields
            const initials = currentUser.fullName.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('profileInitials').textContent = initials;
            document.getElementById('profileName').textContent = currentUser.fullName;
            document.getElementById('profileId').textContent = `IRCTC User ID: ${currentUser.id}`;
            
            document.getElementById('p_fullName').value = currentUser.fullName;
            document.getElementById('p_email').value = currentUser.email;
            document.getElementById('p_mobile').value = currentUser.mobile || "";

            // Handle Profile Form Submission
            const form = document.getElementById('profileForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const newEmail = document.getElementById('p_email').value.trim();
                const newMobile = document.getElementById('p_mobile').value.trim();

                const db = DB_API.getAll();
                const userIndex = db.users.findIndex(u => u.id === currentUser.id);

                if (userIndex !== -1) {
                    db.users[userIndex].email = newEmail;
                    db.users[userIndex].mobile = newMobile;
                    
                    localStorage.setItem('irctc_db', JSON.stringify(db));
                    alert("Profile updated successfully!");
                } else {
                    alert("Error updating profile.");
                }
            });
        });
    </script>
</body>
</html>
