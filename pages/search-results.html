<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Train Search Results | IRCTC Clone</title>
  <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans relative min-h-screen">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-8 pt-4 md:pt-8">
        <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">
        <nav class="flex items-center justify-between p-4 mb-0">
            <!-- Logo -->
            <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
            </div>
            
            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-6 items-center">
                <a href="home.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Home</a>
                <a href="TrainSearch.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Trains</a>
                <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                <!-- NEW LINKS -->
                <a href="e-wallet.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                <a href="alerts.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors flex items-center">
                    Alerts 
                    <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1.5 shadow-sm">2</span>
                </a>
                <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='my-bookings.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors">
                    My Bookings
                </button>
                <button onclick="window.location.href='login.html'" class="bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors">
                    Login / Register
                </button>
            </div>
        </nav>
        </div>
    </header>

    <!-- STANDARDIZED CONTENT AREA -->
    <main class="w-full relative z-10 px-4 md:px-8 py-6 md:py-10">
        <div class="max-w-300 mx-auto">
            
            <section class="bg-white border border-gray-200 shadow-sm rounded-lg mb-6">
                <div class="px-4 py-4 flex flex-wrap items-center gap-x-6 gap-y-3">
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">From</div>
                        <div class="font-bold text-irctc-blue">Thiruvananthapuram Ctl <span class="text-gray-400 font-normal text-xs">TVC</span></div>
                    </div>
                    <span class="text-gray-400">&#10230;</span>
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">To</div>
                        <div class="font-bold text-irctc-blue">New Delhi <span class="text-gray-400 font-normal text-xs">NDLS</span></div>
                    </div>
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Date</div>
                        <div class="font-bold text-gray-800">29 Jul 2026</div>
                    </div>
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Class</div>
                        <div class="font-bold text-gray-800">All Classes</div>
                    </div>
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Quota</div>
                        <div class="font-bold text-gray-800" data-quota-label>General</div>
                    </div>
                    <button type="button" class="ml-auto bg-irctc-orange hover:bg-orange-600 text-white text-sm font-semibold px-4 py-2 rounded transition-colors">Modify Search</button>
                </div>
                <div class="px-4 pb-3 flex gap-2 overflow-x-auto">
                    <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">27 Jul<br /><span class="text-[10px] text-gray-400">Mon</span></button>
                    <button type="button" data-date-chip class="shrink-0 bg-irctc-blue text-white text-xs rounded px-3 py-1.5 font-semibold">29 Jul<br /><span class="text-[10px] text-gray-200">Wed</span></button>
                    <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">30 Jul<br /><span class="text-[10px] text-gray-400">Thu</span></button>
                </div>
                <div class="px-4 flex gap-4 overflow-x-auto border-t border-gray-100 text-sm">
                    <button type="button" data-quota="GN" class="shrink-0 py-2 border-b-2 border-irctc-orange text-irctc-blue font-semibold">General</button>
                    <button type="button" data-quota="TQ" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Tatkal</button>
                    <button type="button" data-quota="PT" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Premium Tatkal</button>
                </div>
            </section>

            <div class="flex flex-col md:flex-row gap-5">
                <aside id="filtersSidebar" class="hidden md:block w-full md:w-64 shrink-0 bg-white border border-gray-200 rounded-lg p-4 h-fit shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-bold text-irctc-blue text-sm uppercase tracking-wide">Filters</h2>
                        <button id="clearFiltersBtn" type="button" class="text-xs text-irctc-orange font-semibold">Clear all</button>
                    </div>
                    <div class="mb-5">
                        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Journey Class</h3>
                        <div class="space-y-1.5 text-sm">
                            <label class="flex items-center gap-2"><input type="checkbox" value="SL" class="accent-irctc-blue" /> SL — Sleeper</label>
                            <label class="flex items-center gap-2"><input type="checkbox" value="3A" class="accent-irctc-blue" /> 3A — AC 3 Tier</label>
                        </div>
                    </div>
                </aside>

                <section class="flex-1 min-w-0">
                    <div class="bg-white border border-gray-200 shadow-sm rounded-lg px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 mb-4">
                        <button id="filterToggleBtn" type="button" class="md:hidden text-sm font-semibold text-irctc-blue border border-irctc-blue rounded px-3 py-1.5">Filters</button>
                        <div class="flex items-center gap-4 text-sm overflow-x-auto">
                            <span class="text-gray-500 shrink-0">Sort by:</span>
                            <button type="button" class="shrink-0 text-irctc-blue font-semibold">Departure &uarr;</button>
                            <button type="button" class="shrink-0 text-gray-600">Duration</button>
                            <button type="button" class="shrink-0 text-gray-600">Price</button>
                        </div>
                        <span id="resultsCount" class="text-xs text-gray-500 shrink-0"></span>
                    </div>

                    <div id="trainResultsList" class="flex flex-col gap-3"></div>

                    <div id="noResults" class="hidden bg-white border border-gray-200 rounded-lg p-8 text-center text-gray-500">
                        <p class="font-semibold text-gray-700 mb-1">No trains found</p>
                        <p class="text-sm">Try removing a filter or choosing a different class.</p>
                    </div>
                </section>
            </div>

        </div>
    </main>

  <script src="../js/train-search-results.js"></script>
  <script src="../js/train-animation.js"></script>
</body>
</html>
