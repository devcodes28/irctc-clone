<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Train Search Results | IRCTC Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "irctc-blue": "#213d77",
            "irctc-orange": "#fb792b",
            "irctc-light": "#f4f4f4"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-irctc-light font-sans text-gray-800 min-h-screen">

  <!-- ============================================================
       Placeholder nav — Member 2 owns the real navbar component.
       Swap this <header> block for theirs once it's merged in.
       ============================================================ -->
  <header class="bg-irctc-blue text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="text-xl font-bold">IRCTC<span class="text-irctc-orange">.</span></span>
      <span class="text-sm text-gray-200">Train Search Results</span>
    </div>
  </header>

  <!-- Search summary bar -->
  <section class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center gap-x-6 gap-y-3">
      <div>
        <div class="text-[11px] text-gray-500 uppercase tracking-wide">From</div>
        <div class="font-bold text-irctc-blue">Thiruvananthapuram Ctl <span class="text-gray-400 font-normal text-xs">TVC</span></div>
      </div>
      <span class="text-gray-400">&#10230;</span>
      <div>
        <div class="text-[11px] text-gray-500 uppercase tracking-wide">To</div>
        <div class="font-bold text-irctc-blue">New Delhi <span class="text-gray-400 font-normal text-xs">NDLS</span></div>
      </div>
      <div>
        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Date</div>
        <div class="font-bold text-gray-800">29 Jul 2026</div>
      </div>
      <div>
        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Class</div>
        <div class="font-bold text-gray-800">All Classes</div>
      </div>
      <div>
        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Quota</div>
        <div class="font-bold text-gray-800" data-quota-label>General</div>
      </div>
      <button type="button" class="ml-auto bg-irctc-orange hover:bg-orange-600 text-white text-sm font-semibold px-4 py-2 rounded transition-colors">
        Modify Search
      </button>
    </div>

    <!-- Date strip -->
    <div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
      <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">27 Jul<br /><span class="text-[10px] text-gray-400">Mon</span></button>
      <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">28 Jul<br /><span class="text-[10px] text-gray-400">Tue</span></button>
      <button type="button" data-date-chip class="shrink-0 bg-irctc-blue text-white text-xs rounded px-3 py-1.5 font-semibold">29 Jul<br /><span class="text-[10px] text-gray-200">Wed</span></button>
      <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">30 Jul<br /><span class="text-[10px] text-gray-400">Thu</span></button>
      <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">31 Jul<br /><span class="text-[10px] text-gray-400">Fri</span></button>
      <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">01 Aug<br /><span class="text-[10px] text-gray-400">Sat</span></button>
      <button type="button" data-date-chip class="shrink-0 bg-white border border-gray-300 text-gray-700 text-xs rounded px-3 py-1.5">02 Aug<br /><span class="text-[10px] text-gray-400">Sun</span></button>
    </div>

    <!-- Quota tabs -->
    <div class="max-w-7xl mx-auto px-4 flex gap-4 overflow-x-auto border-t border-gray-100 text-sm">
      <button type="button" data-quota="GN" class="shrink-0 py-2 border-b-2 border-irctc-orange text-irctc-blue font-semibold">General</button>
      <button type="button" data-quota="TQ" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Tatkal</button>
      <button type="button" data-quota="PT" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Premium Tatkal</button>
      <button type="button" data-quota="LD" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Ladies</button>
      <button type="button" data-quota="SS" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Lower Berth / Sr. Citizen</button>
      <button type="button" data-quota="PH" class="shrink-0 py-2 border-b-2 border-transparent text-gray-600">Physically Handicapped</button>
    </div>
  </section>

  <!-- Main content -->
  <main class="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row gap-5">

    <!-- Filters sidebar -->
    <aside id="filtersSidebar" class="hidden md:block w-full md:w-64 shrink-0 bg-white border border-gray-200 rounded-lg p-4 h-fit">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-irctc-blue text-sm uppercase tracking-wide">Filters</h2>
        <button id="clearFiltersBtn" type="button" class="text-xs text-irctc-orange font-semibold">Clear all</button>
      </div>

      <!-- Journey class -->
      <div class="mb-5">
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Journey Class</h3>
        <div class="space-y-1.5 text-sm">
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="2S" class="accent-irctc-blue" /> 2S — Second Sitting</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="SL" class="accent-irctc-blue" /> SL — Sleeper</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="3A" class="accent-irctc-blue" /> 3A — AC 3 Tier</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="2A" class="accent-irctc-blue" /> 2A — AC 2 Tier</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="1A" class="accent-irctc-blue" /> 1A — AC First Class</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="CC" class="accent-irctc-blue" /> CC — AC Chair Car</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-class value="EC" class="accent-irctc-blue" /> EC — Executive Chair</label>
        </div>
      </div>

      <!-- Train type -->
      <div class="mb-5">
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Train Type</h3>
        <div class="space-y-1.5 text-sm">
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-type value="Rajdhani" class="accent-irctc-blue" /> Rajdhani</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-type value="Shatabdi" class="accent-irctc-blue" /> Shatabdi</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-type value="Superfast" class="accent-irctc-blue" /> Superfast</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-type value="Express" class="accent-irctc-blue" /> Express</label>
          <label class="flex items-center gap-2"><input type="checkbox" data-filter-type value="Passenger" class="accent-irctc-blue" /> Passenger</label>
        </div>
      </div>

      <!-- Departure time -->
      <div class="mb-5">
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Departure Time</h3>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" data-filter-dep-slot="night-early" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">00-06</button>
          <button type="button" data-filter-dep-slot="morning" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">06-12</button>
          <button type="button" data-filter-dep-slot="midday" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">12-18</button>
          <button type="button" data-filter-dep-slot="night" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">18-24</button>
        </div>
      </div>

      <!-- Arrival time -->
      <div>
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Arrival Time</h3>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" data-filter-arr-slot="night-early" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">00-06</button>
          <button type="button" data-filter-arr-slot="morning" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">06-12</button>
          <button type="button" data-filter-arr-slot="midday" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">12-18</button>
          <button type="button" data-filter-arr-slot="night" class="border border-gray-300 rounded px-2 py-1.5 text-gray-700">18-24</button>
        </div>
      </div>
    </aside>

    <!-- Results -->
    <section class="flex-1 min-w-0">

      <!-- Sort bar -->
      <div class="bg-white border border-gray-200 rounded-lg px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 mb-4">
        <button id="filterToggleBtn" type="button" class="md:hidden text-sm font-semibold text-irctc-blue border border-irctc-blue rounded px-3 py-1.5">
          Filters
        </button>

        <div class="flex items-center gap-4 text-sm overflow-x-auto">
          <span class="text-gray-500 shrink-0">Sort by:</span>
          <button type="button" data-sort-key="depTime" class="shrink-0 text-irctc-blue font-semibold">Departure<span data-sort-arrow> &uarr;</span></button>
          <button type="button" data-sort-key="duration" class="shrink-0 text-gray-600">Duration<span data-sort-arrow></span></button>
          <button type="button" data-sort-key="arrTime" class="shrink-0 text-gray-600">Arrival<span data-sort-arrow></span></button>
          <button type="button" data-sort-key="price" class="shrink-0 text-gray-600">Price<span data-sort-arrow></span></button>
        </div>

        <span id="resultsCount" class="text-xs text-gray-500 shrink-0"></span>
      </div>

      <!-- Train cards render here -->
      <div id="trainResultsList" class="flex flex-col gap-3"></div>

      <!-- Empty state -->
      <div id="noResults" class="hidden bg-white border border-gray-200 rounded-lg p-8 text-center text-gray-500">
        <p class="font-semibold text-gray-700 mb-1">No trains found</p>
        <p class="text-sm">Try removing a filter or choosing a different class.</p>
      </div>

    </section>
  </main>

  <script src="../js/train-search-results.js"></script>
  <script src="../js/train-animation.js"></script>
</body>
</html>
