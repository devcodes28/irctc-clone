<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train Search Results | IRCTC Clone</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans bg-gray-50 m-0 min-h-screen flex flex-col">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-8 pt-4 md:pt-8 shrink-0">
        <div class="max-w-1200 mx-auto bg-white rounded-lg shadow-sm">
            <nav class="flex items-center justify-between p-4 mb-0">
                <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
                </div>
                
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="home.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Home</a>
                    <a href="TrainSearch.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Trains</a>
                    <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                    <a href="e-wallet.html" id="navEwallet" class="hidden text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                    <a href="alerts.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors flex items-center">Alerts</a>
                    <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='my-bookings.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors text-sm">
                        My Bookings
                    </button>
                    <button onclick="window.location.href='login.html'" class="bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors text-sm">
                        Login / Register
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="w-full relative z-10 px-4 md:px-8 py-6 md:py-10 grow">
        <div class="max-w-300 mx-auto">
            
            <section class="bg-white border border-gray-200 shadow-sm rounded-lg mb-6">
                <div class="px-4 py-4 flex flex-wrap items-center gap-x-6 gap-y-3">
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">From</div>
                        <div id="displaySource" class="font-bold text-irctc-blue">--</div>
                    </div>
                    <span class="text-gray-400">&#10230;</span>
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">To</div>
                        <div id="displayDest" class="font-bold text-irctc-blue">--</div>
                    </div>
                    <div>
                        <div class="text-[11px] text-gray-500 uppercase tracking-wide">Date</div>
                        <div id="displayDate" class="font-bold text-gray-800">--</div>
                    </div>
                    <button type="button" onclick="window.location.href='TrainSearch.html'" class="ml-auto bg-irctc-orange hover:bg-orange-600 text-white text-sm font-semibold px-4 py-2 rounded transition-colors">Modify Search</button>
                </div>
            </section>

            <div class="flex flex-col md:flex-row gap-5">
                <section class="flex-1 min-w-0">
                    <div class="bg-white border border-gray-200 shadow-sm rounded-lg px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div class="flex items-center gap-4 text-sm overflow-x-auto">
                            <span class="text-gray-500 shrink-0">Sort by:</span>
                            <button type="button" class="shrink-0 text-irctc-blue font-semibold">Departure &uarr;</button>
                        </div>
                        <span id="resultsCount" class="text-xs text-gray-500 shrink-0"></span>
                    </div>

                    <div id="trainResultsList" class="flex flex-col gap-3"></div>

                    <div id="noResults" class="hidden bg-white border border-gray-200 rounded-lg p-8 text-center text-gray-500">
                        <p class="font-semibold text-gray-700 mb-1">No trains found</p>
                        <p class="text-sm">Try removing a filter or choosing a different route.</p>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <script src="../js/db.js"></script>
    <script>
        // --- UPDATED: Smarter Auth Check ---
        window.proceedToBooking = function(trainNumber) {
            // 1. ALWAYS save the train first, even if they aren't logged in yet
            localStorage.setItem('selected_train', trainNumber);
            
            const isLoggedIn = localStorage.getItem('current_user_id') !== null;
            
            if (!isLoggedIn) {
                // 2. Set a flag so the login page knows where to send them back to
                localStorage.setItem('redirect_to_booking', 'true');
                alert("Login to proceed with booking.");
                window.location.href = 'login.html';
            } else {
                // 3. Already logged in, go straight to booking
                window.location.href = 'booking.html';
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const searchData = JSON.parse(localStorage.getItem('last_search'));
            
            if (searchData) {
                document.getElementById('displaySource').innerHTML = `${searchData.sourceName}`;
                document.getElementById('displayDest').innerHTML = `${searchData.destName}`;
                document.getElementById('displayDate').textContent = searchData.date;
            } else {
                window.location.href = 'TrainSearch.html';
                return;
            }

            const allTrains = DB_API.getAll().trains;
            // FILTER ONLY TRAINS THAT MATCH THE SEARCH
            const matchedTrains = allTrains.filter(t => t.originCode === searchData.sourceCode && t.destinationCode === searchData.destCode);
            
            const container = document.getElementById('trainResultsList');
            const noResults = document.getElementById('noResults');
            
            if (matchedTrains.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            document.getElementById('resultsCount').textContent = `${matchedTrains.length} Results`;

            matchedTrains.forEach(train => {
                let classHTML = '';
                train.availableClasses.forEach(cls => {
                    classHTML += `
                        <div class="border border-gray-300 bg-gray-50 rounded-lg p-3 text-center cursor-pointer hover:border-irctc-orange transition">
                            <p class="font-bold text-irctc-blue">${cls.classType}</p>
                            <p class="text-[10px] text-green-600 font-bold mt-1 uppercase tracking-wide">AVL ${cls.availableSeats}</p>
                            <p class="text-xs text-gray-700 font-semibold mt-1">₹${cls.baseFare}</p>
                        </div>
                    `;
                });

                const trainCard = document.createElement('div');
                trainCard.className = 'bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-2';
                trainCard.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start border-b border-gray-100 pb-4 mb-4 gap-4">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900">${train.trainName} <span class="text-gray-500 font-medium text-sm ml-1">(${train.trainNumber})</span></h3>
                            <p class="text-sm text-gray-500 mt-1 uppercase tracking-wide font-semibold text-[11px]">${train.originName} <span class="text-irctc-orange mx-1">➔</span> ${train.destinationName}</p>
                        </div>
                        <div class="text-left md:text-right">
                            <p class="text-lg font-black text-irctc-blue">${train.departureTime} <span class="text-gray-400 text-sm font-medium mx-1">—</span> ${train.arrivalTime}</p>
                            <button onclick="proceedToBooking('${train.trainNumber}')" class="mt-2 bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-lg text-xs tracking-wide transition shadow-sm w-full md:w-auto">
                                Book Now
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${classHTML}
                    </div>
                `;
                
                container.appendChild(trainCard);
            });
        });
    </script>
</body>
</html>
