<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts & Notifications | IRCTC Clone</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans bg-gray-50 m-0 min-h-screen flex flex-col">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-8 pt-4 md:pt-8 shrink-0">
        <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">
            <nav class="flex items-center justify-between p-4 mb-0">
                <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
                </div>
                
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="home.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Home</a>
                    <a href="TrainSearch.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Trains</a>
                    <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                    <a href="dashboard.html" id="navDashboard" class="hidden text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Dashboard</a>
                    <a href="e-wallet.html" id="navEwallet" class="hidden text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                    <a href="alerts.html" class="text-irctc-orange font-bold border-b-2 border-irctc-orange pb-1 transition-colors flex items-center">Alerts</a>
                    <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>

                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='my-bookings.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors text-sm">
                        My Bookings
                    </button>
                    <button id="authBtn" onclick="window.location.href='login.html'" class="bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors text-sm">
                        Login / Register
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="w-full relative z-10 px-4 md:px-8 py-6 md:py-10 grow">
        <div class="max-w-300 mx-auto space-y-6">
            
            <div class="bg-white p-6 shadow-md rounded-2xl border-t-4 border-irctc-blue">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-irctc-blue">System & Account Alerts</h2>
                        <p class="text-xs text-gray-500 mt-1">Stay updated with your latest transactions, booking statuses, and IRCTC advisories.</p>
                    </div>
                </div>

                <!-- Alerts Dynamic List Container -->
                <div id="alertsContainer" class="space-y-4">
                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-center text-gray-500 text-sm">
                        Loading alerts from database...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer style="background-color: #071936 !important;" class="text-white pt-10 pb-6 border-t-4 border-irctc-orange relative z-30 w-full shadow-xl shrink-0 mt-auto">
        <div class="max-w-300 mx-auto px-4 md:px-8 text-center text-xs text-gray-300">
            <p class="font-medium">Copyright © 2026 - www.irctc.co.in. All Rights Reserved</p>
        </div>
    </footer>
    
    <script src="../js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = DB_API.getCurrentUser();
            const container = document.getElementById('alertsContainer');
            const badge = document.getElementById('alertBadge');

            if (!currentUser) {
                container.innerHTML = `
                    <div class="p-6 bg-yellow-50 border border-yellow-200 rounded-lg text-center text-yellow-800 text-sm">
                        Please <a href="login.html" class="font-bold underline text-irctc-orange">login</a> to view your account alerts.
                    </div>
                `;
                if (badge) badge.textContent = '0';
                return;
            }

            // Fetch alerts from the database via DB_API helper
            const alerts = await DB_API.getUserAlerts(currentUser._id || currentUser.id);

            if (!alerts || alerts.length === 0) {
                container.innerHTML = `
                    <div class="p-8 bg-gray-50 border border-gray-200 rounded-lg text-center text-gray-500 text-sm">
                        No new alerts found at this time.
                    </div>
                `;
                if (badge) badge.textContent = '0';
                return;
            }

            // Update badge count
            if (badge) badge.textContent = alerts.length;

            // Render alerts dynamically
            container.innerHTML = alerts.map(alert => {
                let borderColor = 'border-blue-200 bg-blue-50 text-blue-900';
                let iconColor = 'text-irctc-blue';
                
                if (alert.type === 'success') {
                    borderColor = 'border-green-200 bg-green-50 text-green-900';
                    iconColor = 'text-green-600';
                } else if (alert.type === 'warning') {
                    borderColor = 'border-orange-200 bg-orange-50 text-orange-900';
                    iconColor = 'text-irctc-orange';
                } else if (alert.type === 'critical') {
                    borderColor = 'border-red-200 bg-red-50 text-red-900';
                    iconColor = 'text-red-600';
                }

                const dateStr = alert.createdAt ? new Date(alert.createdAt).toLocaleString('en-IN', {
                    dateStyle: 'medium',
                    timeStyle: 'short'
                }) : 'Just now';

                const alertTitle = alert.title || (alert.type ? `${alert.type.toUpperCase()} Advisory` : 'IRCTC Notification');


                return `
                    <div class="p-4 border ${borderColor} rounded-xl shadow-sm flex items-start space-x-4 transition">
                        <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shrink-0 shadow-sm ${iconColor}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                        </div>
                        <div class="grow">
                            <div class="flex justify-between items-center mb-1">
                                <h4 class="font-bold text-base">${alertTitle}</h4>
                                <span class="text-[11px] opacity-75">${dateStr}</span>
                            </div>
                            <p class="text-xs leading-relaxed opacity-90">${alert.message}</p>
                        </div>
                    </div>
                `;
            }).join('');
        });
    </script>
    <script src="../js/train-animation.js"></script>

</body>
</html>
