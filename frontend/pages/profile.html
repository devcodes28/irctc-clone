<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Profile | IRCTC Clone</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="text-gray-800 font-sans bg-gray-50 m-0 min-h-screen flex flex-col">

    <!-- STANDARDIZED HEADER -->
    <header class="w-full relative z-20 px-4 md:px-8 pt-4 md:pt-8 shrink-0">
        <div class="max-w-300 mx-auto bg-white rounded-lg shadow-sm">
            <nav class="flex items-center justify-between p-4 mb-0">
                <div class="flex items-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-3xl font-bold text-irctc-blue">IRCTC</span>
                </div>
                
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="home.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Home</a>
                    <a href="TrainSearch.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Trains</a>
                    <a href="holidays.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Holidays</a>
                    <a href="dashboard.html" id="navDashboard" class="hidden text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Dashboard</a>
                    <a href="e-wallet.html" id="navEwallet" class="hidden text-gray-700 hover:text-irctc-orange font-semibold transition-colors">E-wallet</a>
                    <a href="alerts.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors flex items-center">Alerts</a>
                    <a href="contact-us.html" class="text-gray-700 hover:text-irctc-orange font-semibold transition-colors">Contact Us</a>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='my-bookings.html'" class="border-2 border-irctc-blue text-irctc-blue hover:bg-blue-50 font-bold py-2 px-4 rounded transition-colors text-sm">
                        My Bookings
                    </button>
                    <button id="authBtn" onclick="window.location.href='login.html'" class="bg-irctc-orange hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors text-sm">
                        Login / Register
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="w-full relative z-10 px-4 md:px-8 py-6 md:py-10 grow">
        <div class="max-w-300 mx-auto space-y-6">
            
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-irctc-blue">Account Profile</h2>
                <a href="dashboard.html" class="text-sm font-semibold text-irctc-orange hover:underline">← Back to Dashboard</a>
            </div>

            <div class="bg-white shadow-md rounded-2xl border-t-4 border-irctc-blue overflow-hidden">
                
                <!-- Profile Header Banner -->
                <div class="bg-irctc-blue p-6 text-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">                   
                    <div class="flex items-center space-x-4">
                        <div id="userAvatar" class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold tracking-wider uppercase shrink-0">
                            --
                        </div>
                        <div>
                            <h3 id="userNameDisplay" class="text-xl font-bold">Loading...</h3>
                            <p id="userIdDisplay" class="text-xs text-blue-200 mt-0.5">IRCTC User ID: --</p>
                            <span class="inline-block mt-2 bg-white/20 text-white text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Verified Account</span>
                        </div>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md rounded-xl border border-white/20 px-5 py-3 text-left sm:text-right w-full sm:w-auto">
                        <p class="text-xs text-blue-200 font-semibold uppercase tracking-wide">E-Wallet Balance</p>
                        <p id="profileWalletBal" class="text-2xl font-black text-white mt-0.5">₹0.00</p>
                        <a href="e-wallet.html" class="inline-block mt-1 text-xs text-irctc-orange font-bold hover:underline">Manage Wallet &rarr;</a>
                    </div>
                </div>

                <!-- Profile Form -->
                <div class="p-6 md:p-8">
                    <h4 class="text-gray-900 font-bold mb-4 border-b border-gray-100 pb-2 text-sm uppercase tracking-wider">Personal Information</h4>
                    
                    <form id="profileForm" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                                <input type="text" id="p_fullName" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-irctc-blue focus:ring-2 focus:ring-blue-100 outline-none transition text-sm font-semibold text-gray-800">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Date of Birth</label>
                                <input type="date" id="p_dob" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-irctc-blue focus:ring-2 focus:ring-blue-100 outline-none transition text-sm font-semibold text-gray-800">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
                                <input type="email" id="p_email" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-irctc-blue focus:ring-2 focus:ring-blue-100 outline-none transition text-sm font-semibold text-gray-800">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Mobile Number</label>
                                <input type="tel" id="p_mobile" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-irctc-blue focus:ring-2 focus:ring-blue-100 outline-none transition text-sm font-semibold text-gray-800">
                            </div>
                        </div>

                        <div class="mt-8 pt-4 border-t border-gray-100 flex justify-end gap-3">
                            <button type="submit" class="bg-irctc-orange hover:bg-orange-600 text-white px-8 py-3 rounded-lg font-bold transition shadow-sm text-sm">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>

            </div>

        </div>
    </main>

    <footer style="background-color: #071936 !important;" class="text-white pt-10 pb-6 border-t-4 border-irctc-orange relative z-30 w-full shadow-xl shrink-0 mt-auto">
        <div class="max-w-300 w-full mx-auto px-4 md:px-8 text-center text-xs text-gray-300">
            <p class="font-medium">Copyright © 2026 - www.irctc.co.in. All Rights Reserved</p>
        </div>
    </footer>

    <!-- PROFILE MANAGEMENT SCRIPT -->
    <script src="../js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = DB_API.getCurrentUser();
            
            if (!currentUser) {
                alert('Please login to view your profile.');
                window.location.href = 'login.html';
                return;
            }

            const userId = currentUser._id || currentUser.id;

            // Fetch live user profile and live wallet balance directly from MongoDB
            try {
                const res = await fetch(`http://localhost:5000/api/users/${userId}`);
                const data = await res.json();
                if (data.success && data.user) {
                    localStorage.setItem('current_user', JSON.stringify(data.user));
                    Object.assign(currentUser, data.user);
                }
            } catch (err) {
                console.error("Failed to sync profile from DB:", err);
            }

            // Populate header banner details
            const fullName = currentUser.fullName || 'User';
            document.getElementById('userNameDisplay').textContent = fullName;
            document.getElementById('userIdDisplay').textContent = `IRCTC User ID: ${currentUser.username || currentUser._id || currentUser.id || 'N/A'}`;
            
            const initials = fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('userAvatar').textContent = initials || 'U';

            // Populate live wallet balance
            const bal = (currentUser.walletBalance !== undefined && !isNaN(currentUser.walletBalance))
                ? Number(currentUser.walletBalance)
                : 5000.00;
            const profileWalletEl = document.getElementById('profileWalletBal');
            if (profileWalletEl) {
                profileWalletEl.textContent = `₹${bal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            }

            // Populate form fields with real database data
            document.getElementById('p_fullName').value = fullName;
            document.getElementById('p_email').value = currentUser.email || '';
            document.getElementById('p_mobile').value = currentUser.mobile || '';
            
            const dobInput = document.getElementById('p_dob');
            if (dobInput && currentUser.dob) {
                dobInput.value = currentUser.dob.split('T')[0];
            }


            // Handle Profile Update Submission
            const profileForm = document.getElementById('profileForm');
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const updatedData = {
                    fullName: document.getElementById('p_fullName').value.trim(),
                    email: document.getElementById('p_email').value.trim(),
                    mobile: document.getElementById('p_mobile').value.trim(),
                    dob: document.getElementById('p_dob').value
                };

                const userId = currentUser._id || currentUser.id;
                const result = await DB_API.updateProfile(userId, updatedData);

                if (result && result.success) {
                    alert('Profile updated successfully!');
                    location.reload();
                } else {
                    alert(result?.message || 'Failed to update profile.');
                }
            });
        });
    </script>
    <script src="../js/train-animation.js"></script>

</body>
</html>
